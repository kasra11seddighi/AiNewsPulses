
name: News Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 2 * * *"
    - cron: "0 5 * * *"
    - cron: "30 7 * * *"
    - cron: "0 10 * * *"
    - cron: "30 12 * * *"
    - cron: "0 15 * * *"
    - cron: "30 17 * * *"
    - cron: "0 20 * * *"
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: news-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Publish news
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}

          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ vars.BALE_CHANNEL_ID || '@AINewsD1' }}
          ENABLE_BALE_PUBLISHING: ${{ vars.ENABLE_BALE_PUBLISHING || 'false' }}

          ENABLE_PUBLISHING: "true"
          DAILY_POST_LIMIT: "10"
          MAX_POSTS_PER_RUN: "1"
          MIN_QUALITY_SCORE: "65"
          MIN_ARTICLE_TEXT_CHARS: "800"
          ALLOW_ARTICLE_IMAGES: "false"
          IMAGE_ALLOWED_DOMAINS: ""
          LOG_LEVEL: INFO
          TIMEZONE: Asia/Tehran

        run: python main.py

      - name: Save database
        if: always()
        run: |
          if [ ! -f data/ainewspulses.db ]; then
            echo "Database file not found; nothing to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/ainewspulses.db

          if git diff --cached --quiet; then
            echo "Database unchanged."
            exit 0
          fi

          git commit -m "Update news database"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Database successfully saved."
              exit 0
            fi

            sleep 5
          done

          echo "Failed to push database after 3 attempts."
          exit 1

