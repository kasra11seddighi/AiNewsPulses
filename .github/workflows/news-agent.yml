
name: News Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"

permissions:
  contents: write

concurrency:
  group: news-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Publish news
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          ENABLE_PUBLISHING: "true"
          DAILY_POST_LIMIT: "3"
          MAX_POSTS_PER_RUN: "1"
          MIN_QUALITY_SCORE: "65"
          MIN_ARTICLE_TEXT_CHARS: "800"
          ALLOW_ARTICLE_IMAGES: "false"
          IMAGE_ALLOWED_DOMAINS: ""
          LOG_LEVEL: INFO
          TIMEZONE: Asia/Tehran
        run: python main.py

      - name: Save database
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/ainewspulses.db ]; then
            echo "Database file not found; nothing to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/ainewspulses.db

          if git diff --cached --quiet; then
            echo "Database unchanged."
          else
            git commit -m "Update news database"
            git push
          fi
