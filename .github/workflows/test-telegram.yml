
name: Test Telegram Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send one test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHANNEL_ID"]

          if not token or not chat_id:
              raise SystemExit("Telegram token or channel ID is missing.")

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "✅ تست اتصال AiNewsPulses موفق بود؛ این فقط یک پیام آزمایشی است."
          }).encode()

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode())
          except urllib.error.HTTPError as error:
              result = json.loads(error.read().decode())
              raise SystemExit(
                  f"Telegram rejected the test message: "
                  f"{result.get('description', 'Unknown error')}"
              )
          except Exception as error:
              raise SystemExit(
                  f"Telegram connection failed: {type(error).__name__}"
              )

          if not result.get("ok"):
              raise SystemExit("Telegram did not confirm the test message.")

          print("SUCCESS: Telegram confirmed the test message.")
          PY
